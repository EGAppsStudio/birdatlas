<html><head><style>
        @font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf');font-weight:700}
        @font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Regular.ttf');font-weight:400}
        @font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf');font-weight:500}
        body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:P;background:#EEF0EC;position:relative}
        .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(46,98,181,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(46,98,181,.06) 1px,transparent 1px);background-size:40px 40px}
        .c{position:absolute;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 12px rgba(10,62,112,.18);opacity:.9}
        .left::before{content:"";position:absolute;left:-64px;top:-40px;bottom:-40px;width:560px;background:linear-gradient(90deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.6) 70%,rgba(255,255,255,0) 100%);z-index:-1}.left{z-index:1;position:absolute;left:64px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
        .logo{width:118px;height:118px;border-radius:50%;border:5px solid #fff;box-shadow:0 8px 22px rgba(10,62,112,.22);margin-bottom:18px}
        .t{font-weight:700;font-size:62px;line-height:1;letter-spacing:-1px;color:#1C3A6B} .t span{color:#2E62B5}
        .dots{margin:16px 0 10px} .s{font-size:22px;color:#4A5B70}
        .chips{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;max-width:480px} .chip{background:#fff;border:1.5px solid #c8d8ee;border-radius:18px;padding:5px 12px;font-weight:500;font-size:15px;color:#1C3A6B}
        .mv{position:absolute;right:46px;bottom:18px}
        .bubble{position:absolute;right:250px;bottom:300px;background:#fff;border-radius:16px;padding:10px 14px;font-weight:500;font-size:16px;color:#1C3A6B;box-shadow:0 4px 14px rgba(10,62,112,.15)}
        .bubble:after{content:'';position:absolute;right:-8px;bottom:12px;border:8px solid transparent;border-left-color:#fff}
        </style></head><body><img src="map.png" style="position:absolute;inset:0;width:1024px;height:500px"><div class="c" style="left:560px;top:40px;width:70px;height:70px;background:#2E62B5;"></div><div class="c" style="left:650px;top:120px;width:46px;height:46px;background:#3FA34D;"></div><div class="c" style="left:610px;top:250px;width:90px;height:90px;background:#E9C440;"></div><div class="c" style="left:730px;top:60px;width:40px;height:40px;background:#2E62B5;"></div><div class="c" style="left:760px;top:330px;width:60px;height:60px;background:#E8743B;"></div><div class="c" style="left:540px;top:370px;width:38px;height:38px;background:#3FA34D;"></div><div class="c" style="left:700px;top:200px;width:30px;height:30px;background:#2E62B5;"></div><div class="c" style="left:840px;top:160px;width:54px;height:54px;background:#2E62B5;"></div>
        <div class="left"><img class="logo" src="logo.png">
        <div class="t">Bird <span>Atlas</span></div>
        <div class="dots"><svg width="48" height="10"><circle cx="8" cy="5" r="4" fill="#2E62B5"/><circle cx="24" cy="5" r="4" fill="#E9C440"/><circle cx="40" cy="5" r="4" fill="#1C3A6B"/></svg></div>
        <div class="s">Your personal birding map</div>
        <div class="chips"><div class="chip">🗺️ Map</div><div class="chip">🏆 Lifers</div><div class="chip">📊 Charts</div><div class="chip">🐦 Maviş</div><div class="chip">📤 Share cards</div><div class="chip">📷 Your own photos</div></div></div></div></div>
        <div class="bubble">Hi! I'm Maviş 👋</div>
        <div class="mv" id="mv"></div>
        <script>        // ===== Maviş: maskotumuz (dürbünlü Mavi Baştankara) =====
        // Parçalar ayrı gruplar (animasyon için): mv-all, mv-wing-l, mv-wing-r, mv-head, mv-eyes, mv-pupil, mv-binoc, mv-strap
        // mode: 'idle' (göz kırpar), 'wave' (el sallar), 'think' (dürbünü gözüne kaldırır), 'look' (sağa sola bakar)
        function mavisSVG(size, mode) {
            mode = mode || 'idle';
            const N = '#0A3E70', B = '#2A7DE1', W = '#FFFFFF';
            return `<svg class="mavis mavis-${mode}" width="${size}" height="${size}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <g class="mv-all">
                <ellipse cx="100" cy="191" rx="50" ry="6" fill="${N}" opacity="0.12"/>
                <!-- kuyruk -->
                <path d="M128,160 C142,158 160,164 170,174 C160,178 146,178 132,172 Z" fill="#1F64C4"/>
                <path d="M130,166 C144,166 156,170 166,176" stroke="#5FA2F0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <!-- gövde -->
                <ellipse cx="100" cy="140" rx="54" ry="46" fill="#7FA35A"/>
                <ellipse cx="100" cy="144" rx="42" ry="42" fill="#FCD116"/>
                <path d="M100,122 C98,138 98,156 100,176 C102,156 102,138 100,122 Z" fill="#B59A1A" opacity="0.45"/>
                <!-- ayaklar -->
                <g stroke="#5C6B7A" stroke-width="5" stroke-linecap="round" fill="none">
                  <path d="M84,180 l-7,9 M84,180 l0,10 M84,180 l7,9"/>
                  <path d="M116,180 l-7,9 M116,180 l0,10 M116,180 l7,9"/>
                </g>
                <!-- dürbün askısı -->
                <path class="mv-strap" d="M70,112 C76,130 82,138 88,140 M130,112 C124,130 118,138 112,140" stroke="#8B5A2B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <!-- sol kanat (el sallar, dürbünü tutar) -->
                <g class="mv-wing-l">
                  <path d="M54,112 C38,110 28,130 34,148 C38,160 52,162 58,150 C64,136 64,118 54,112 Z" fill="${B}"/>
                  <path d="M37,136 C44,139 52,139 59,136" stroke="${W}" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                </g>
                <!-- sağ kanat -->
                <g class="mv-wing-r">
                  <path d="M146,112 C162,110 172,130 166,148 C162,160 148,162 142,150 C136,136 136,118 146,112 Z" fill="${B}"/>
                  <path d="M163,136 C156,139 148,139 141,136" stroke="${W}" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                </g>
                <!-- baş -->
                <g class="mv-head">
                  <circle cx="100" cy="72" r="50" fill="${W}"/>
                  <!-- tepe (mavi taç + perçem) -->
                  <path d="M51.5,60 A50,50 0 0 1 148.5,60 C138,52 120,48 100,48 C80,48 62,52 51.5,60 Z" fill="${B}"/>
                  <path d="M78,30 C82,16 96,7 108,11 C103,13 100,16 99,19 C108,12 122,15 124,30 Z" fill="${B}"/>
                  <!-- yüz deseni: gagadan gözlerin içinden enseye bant + yaka + çene -->
                  <path d="M100,85 C93,77 86,69 74,66.5 C64,64.5 56,66 51.5,68 L50.4,77 C57,75 65,74.5 73,76.5 C84,79 92,84 100,91 Z" fill="${N}"/>
                  <path d="M100,85 C107,77 114,69 126,66.5 C136,64.5 144,66 148.5,68 L149.6,77 C143,75 135,74.5 127,76.5 C116,79 108,84 100,91 Z" fill="${N}"/>
                  <path d="M52,86 A50,50 0 0 0 148,86 C143,100 126,111 109,112.5 C105,109 102.5,104 101.5,92 L98.5,92 C97.5,104 95,109 91,112.5 C74,111 57,100 52,86 Z" fill="${N}"/>
                  <path d="M51.5,60 A50,50 0 1 0 148.5,60" fill="none" stroke="${N}" stroke-width="3.5"/>
                  <!-- yanaklar -->
                  <ellipse cx="72" cy="92" rx="8" ry="5" fill="#FF8FA3" opacity="0.6"/>
                  <ellipse cx="128" cy="92" rx="8" ry="5" fill="#FF8FA3" opacity="0.6"/>
                  <!-- gözler -->
                  <g class="mv-eyes">
                    <g class="mv-pupil">
                      <ellipse cx="81" cy="73" rx="9.5" ry="10.5" fill="#15151C" stroke="${W}" stroke-width="2"/>
                      <ellipse cx="119" cy="73" rx="9.5" ry="10.5" fill="#15151C" stroke="${W}" stroke-width="2"/>
                      <circle cx="84.5" cy="68.5" r="3.4" fill="${W}"/>
                      <circle cx="122.5" cy="68.5" r="3.4" fill="${W}"/>
                    </g>
                  </g>
                  <!-- gaga -->
                  <path d="M93.5,82.5 Q100,80 106.5,82.5 Q103,90 100,92.5 Q97,90 93.5,82.5 Z" fill="#4A5260"/>
                  <path d="M96.5,83 Q100,82 103.5,83" stroke="${W}" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5"/>
                </g>
                <!-- dürbün -->
                <g class="mv-binoc">
                  <rect x="94" y="136" width="12" height="9" rx="3" fill="#2E3E5C"/>
                  <circle cx="87" cy="142" r="13.5" fill="#1B2B45"/>
                  <circle cx="113" cy="142" r="13.5" fill="#1B2B45"/>
                  <circle cx="87" cy="142" r="8.5" fill="#9FD3FF"/>
                  <circle cx="113" cy="142" r="8.5" fill="#9FD3FF"/>
                  <circle cx="84" cy="139" r="3" fill="${W}" opacity="0.9"/>
                  <circle cx="110" cy="139" r="3" fill="${W}" opacity="0.9"/>
                </g>
              </g>
            </svg>`;
        }
        // ===== /Maviş =====
; document.getElementById('mv').innerHTML=mavisSVG(250,'idle');</script>
        <style>.mavis *{animation:none!important}</style></body></html>
