<html><head><style>
        @font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf');font-weight:700}
        @font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Regular.ttf');font-weight:400}
        @font-face{font-family:P;src:url('file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf');font-weight:500}
        body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:P;background:#EEF0EC;position:relative}
        .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(46,98,181,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(46,98,181,.06) 1px,transparent 1px);background-size:40px 40px}
        .c{position:absolute;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 12px rgba(10,62,112,.18);opacity:.9}
        .left::before{content:"";position:absolute;left:-64px;top:-40px;bottom:-40px;width:560px;background:linear-gradient(90deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.6) 70%,rgba(255,255,255,0) 100%);z-index:-1}.left{z-index:1;position:absolute;left:64px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
        .logo{width:118px;height:118px;border-radius:50%;border:5px solid #fff;box-shadow:0 8px 22px rgba(10,62,112,.22);margin-bottom:18px}

        .dots{margin:16px 0 10px} .s{font-size:22px;color:#4A5B70}
        .chips{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;max-width:480px} .chip{background:#fff;border:1.5px solid #c8d8ee;border-radius:18px;padding:5px 12px;font-weight:500;font-size:15px;color:#1C3A6B}

        .bubble:after{content:'';position:absolute;right:-8px;bottom:12px;border:8px solid transparent;border-left-color:#fff}
        </style></head><body><img src="map.png" style="position:absolute;inset:0;width:1024px;height:500px"><div class="c" style="left:560px;top:40px;width:70px;height:70px;background:#2E62B5;"></div><div class="c" style="left:650px;top:120px;width:46px;height:46px;background:#3FA34D;"></div><div class="c" style="left:610px;top:250px;width:90px;height:90px;background:#E9C440;"></div><div class="c" style="left:730px;top:60px;width:40px;height:40px;background:#2E62B5;"></div><div class="c" style="left:760px;top:330px;width:60px;height:60px;background:#E8743B;"></div><div class="c" style="left:540px;top:370px;width:38px;height:38px;background:#3FA34D;"></div><div class="c" style="left:700px;top:200px;width:30px;height:30px;background:#2E62B5;"></div><div class="c" style="left:840px;top:160px;width:54px;height:54px;background:#2E62B5;"></div>
        <div class="left"><img class="logo" src="logo.png">
        <div class="t">Bird <span>Atlas</span></div>

        <script>        // ===== Maviş: maskotumuz (dürbünlü Mavi Baştankara) =====
        // Parçalar ayrı gruplar (animasyon için): mv-all, mv-wing-l, mv-wing-r, mv-head, mv-eyes, mv-pupil, mv-binoc, mv-strap
        // mode: 'idle' (göz kırpar), 'wave' (el sallar), 'think' (dürbünü gözüne kaldırır), 'look' (sağa sola bakar)

            mode = mode || 'idle';
            const N = '#0B3B73', B = '#2B7FE3', W = '#FFFFFF';
            const wing = 'M110,404 C64,396 32,466 42,540 C50,600 92,620 122,600 C150,560 152,436 110,404 Z';
            return `<svg class="mavis mavis-${mode}" width="${size}" height="${size}" viewBox="-55 10 690 690" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <g class="mv-all">
                <ellipse cx="290" cy="684" rx="200" ry="20" fill="${N}" opacity="0.1"/>
                <!-- kuyruk -->
                <path d="M395,572 C452,560 505,594 520,646 C478,656 436,642 402,612 Z" fill="#1F66C9"/>
                <!-- gövde: yeşil sırt + sarı göğüs -->
                <ellipse cx="290" cy="482" rx="204" ry="176" fill="#7FA35A"/>
                <ellipse cx="290" cy="506" rx="166" ry="152" fill="#FCD116"/>
                <!-- ayaklar -->
                <g stroke="#56657A" stroke-width="16" stroke-linecap="round" fill="none">
                  <path d="M234,632 L194,664 M234,632 L224,690 M234,632 L262,682"/>
                  <path d="M346,632 L386,664 M346,632 L356,690 M346,632 L318,682"/>
                </g>
                <!-- dürbün askısı -->
                <path class="mv-strap" d="M152,382 C176,420 200,450 226,470 M428,382 C404,420 380,450 354,470" stroke="#8B5A2B" stroke-width="9" fill="none" stroke-linecap="round"/>
                <!-- sol kanat -->
                <g class="mv-wing-l">
                  <path d="${wing}" fill="${B}"/>
                  <path d="M54,496 C80,503 106,501 128,493" stroke="${W}" stroke-width="13" stroke-linecap="round" fill="none"/>
                </g>
                <!-- sağ kanat (el sallar) -->
                <g class="mv-wing-r">
                  <g transform="translate(580,0) scale(-1,1)">
                    <path d="${wing}" fill="${B}"/>
                    <path d="M54,496 C80,503 106,501 128,493" stroke="${W}" stroke-width="13" stroke-linecap="round" fill="none"/>
                  </g>
                </g>
                <!-- baş -->
                <g class="mv-head">
                  <!-- lacivert yüz çerçevesi + çene (önlük) -->
                  <path d="M94,232 C94,128 180,92 290,92 C400,92 486,128 486,232 C486,312 452,362 386,371 C356,376 334,396 290,398 C246,396 224,376 194,371 C128,362 94,312 94,232 Z" fill="${N}"/>
                  <!-- beyaz yüz: alın + iki yanak -->
                  <path d="M108,232 C108,150 190,110 290,110 C390,110 472,150 472,232 C472,302 444,350 384,357 C334,362 298,350 290,316 C282,350 246,362 196,357 C136,350 108,302 108,232 Z" fill="${W}"/>
                  <!-- mavi tepe (tüylü) -->
                  <path d="M110,214 C104,146 136,80 196,58 C200,48 206,42 214,38 C214,46 216,50 220,52 C244,44 270,40 292,40 C300,30 314,22 332,18 C326,28 326,34 328,40 C346,34 364,34 382,40 C372,44 368,50 368,56 C384,58 400,64 412,74 C400,76 396,82 398,90 C446,122 478,160 470,214 C434,182 370,168 290,168 C210,168 146,182 110,214 Z" fill="${B}"/>
                  <!-- göz bandı: gagadan gözlerin içinden enseye -->
                  <path d="M290,272 C260,256 230,236 190,233 C150,230 120,234 100,240 L101,270 C132,263 166,263 196,269 C232,277 262,290 290,302 Z" fill="${N}"/>
                  <path d="M290,272 C320,256 350,236 390,233 C430,230 460,234 480,240 L479,270 C448,263 414,263 384,269 C348,277 318,290 290,302 Z" fill="${N}"/>
                  <!-- yanaklar -->
                  <ellipse cx="158" cy="320" rx="30" ry="18" fill="#FFB3BE"/>
                  <ellipse cx="422" cy="320" rx="30" ry="18" fill="#FFB3BE"/>
                  <!-- gözler -->
                  <g class="mv-eyes">
                    <g class="mv-pupil">
                      <circle cx="194" cy="262" r="40" fill="#0D0F1A"/>
                      <circle cx="386" cy="262" r="40" fill="#0D0F1A"/>
                      <circle cx="209" cy="245" r="12" fill="${W}"/>
                      <circle cx="401" cy="245" r="12" fill="${W}"/>
                    </g>
                  </g>
                  <!-- gaga -->
                  <path d="M254,284 Q290,270 326,284 Q308,318 290,332 Q272,318 254,284 Z" fill="#4A5262"/>
                  <path d="M270,284 Q290,278 310,284" stroke="#8892A3" stroke-width="5" stroke-linecap="round" fill="none"/>
                </g>
                <!-- dürbün -->
                <g class="mv-binoc">
                  <rect x="208" y="448" width="28" height="34" rx="9" fill="${N}"/>
                  <rect x="344" y="448" width="28" height="34" rx="9" fill="${N}"/>
                  <rect x="268" y="500" width="44" height="40" rx="10" fill="#22365A"/>
                  <circle cx="236" cy="526" r="56" fill="#16284A"/>
                  <circle cx="344" cy="526" r="56" fill="#16284A"/>
                  <circle cx="236" cy="526" r="37" fill="#9DD0FF"/>
                  <circle cx="344" cy="526" r="37" fill="#9DD0FF"/>
                  <circle cx="222" cy="510" r="11" fill="${W}" opacity="0.9"/>
                  <circle cx="330" cy="510" r="11" fill="${W}" opacity="0.9"/>
                </g>
              </g>
            </svg>`;
        }
        // ===== /Maviş =====
; document.getElementById('mv').innerHTML=mavisSVG(250,'idle');</script>
        <style>.mavis *{animation:none!important}</style></body></html>
